services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: fleet_routing
      POSTGRES_USER: fleet_routing
      POSTGRES_PASSWORD: fleet_routing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_routing -d fleet_routing"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: kafka
      DATABASE_URL: jdbc:postgresql://postgres:5432/fleet_routing
      DATABASE_USER: fleet_routing
      DATABASE_PASSWORD: fleet_routing
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  postgres-data:
