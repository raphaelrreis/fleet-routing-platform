replicaCount: 2

image:
  repository: fleet-routing-platform
  tag: "0.0.1"
  pullPolicy: IfNotPresent

cellId: brs-01

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
