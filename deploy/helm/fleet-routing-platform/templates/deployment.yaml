apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-routing-platform
  labels:
    app.kubernetes.io/name: fleet-routing-platform
    fleet-routing.io/cell-id: {{ .Values.cellId | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-routing-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-routing-platform
        fleet-routing.io/cell-id: {{ .Values.cellId | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CELL_ID
              value: {{ .Values.cellId | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
